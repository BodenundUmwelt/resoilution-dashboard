<style>

<script>
(function(){
"use strict";
// ---------- Grundlagen ----------
const PROBEN_STATUS = [
  ["eingegangen","p-s3"],["in Vorbereitung","p-s2"],["beim Labor","p-warn"],["Ergebnisse da","p-s1"],["ausgewertet","p-s4"],["archiviert","p-mute"]
];
const AUF_STATUS = [["geplant","p-mute"],["versandt","p-warn"],["Ergebnis da","p-s1"]];
const PROJ_STATUS = [["in Planung","p-s3"],["laufend","p-s1"],["pausiert","p-mute"],["abgeschlossen","p-s4"]];
const MATERIAL = ["Grundsubstrat","Zuschlagstoff","Mischung / Behandlungsvariante","Belastetes Material","Bodenprobe Feld","Ernteprobe","Bakterienprodukt","Kreislaufstoff","Sonstiges"];
const SET_COLORS = ["s1","s2","s3","s4"];

const TEAM_DEFAULT = ["Selina","Nadi","Paul","Vitus","Philipp","Harry","Sven"];
const S = { projekte:[], proben:[], lieferanten:[], analysen:[], labore:[], auswertungen:[], notizen:[], kunden:[], produkte:[], ki:{regeln:""}, team:TEAM_DEFAULT.slice(),
  meId:null, canWrite:null, readOnly:false, assets:null, sample:null, user:null, db:null,
  loaded:{}, filter:{q:"",projekt:"",status:"",labor:""}, kFilter:{q:"",land:""}, pFilter:{q:""}, aFilter:{projekt:"",kategorie:""}, kiSel:{projekt:"",set:""}, kiBusy:false, kiText:"", kiCtl:null };

const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtD = d => { if(!d) return "–"; const x = new Date(d.length===10? d+"T00:00:00": d); return isNaN(x)? esc(d) : x.toLocaleDateString("de-DE"); };
const fmtDT = d => { const x = new Date(d); return isNaN(x)? "" : x.toLocaleDateString("de-DE")+" "+x.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); };
const eur = v => (v==null||v==="")? "offen" : Number(v).toLocaleString("de-DE")+" €";
const pill = (txt, list) => { const f = list.find(x=>x[0]===txt); return '<span class="pill '+(f?f[1]:"p-mute")+'">'+esc(txt||"–")+'</span>'; };
const byId = (arr,id) => arr.find(x=>x.id===id);
const proj = id => byId(S.projekte,id);
const lab = id => byId(S.labore,id);
const lief = id => byId(S.lieferanten,id);
const liefName = p => { const l = p && p.lieferantId && lief(p.lieferantId); return l? l.name : (p && p.lieferant) || ""; };
const ana = code => S.analysen.find(a=>a.code===code);
const setOf = (p,setId) => p && (p.sets||[]).find(s=>s.id===setId);
const uid = p => p + Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o||{}));
let toastT;
function toast(msg){ clearTimeout(toastT); let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el);} el.textContent=msg; el.hidden=false; toastT=setTimeout(()=>el.hidden=true,2600); }

// Namen auflösen (nur ids gespeichert)
let names = {};
async function resolveNames(){
  if(!S.user) return;
  const ids = new Set();
  S.proben.forEach(p=>{ if(p.erfasstVon) ids.add(p.erfasstVon); (p.notizen||[]).forEach(n=>n.who&&ids.add(n.who)); });
  S.projekte.forEach(p=>(p.notizen||[]).forEach(n=>n.who&&ids.add(n.who)));

}

// ---------- Datenbank ----------
async function write(col, id, data){
  if(!S.db){ toast("Keine Verbindung zur Datenbank."); throw new Error("no db"); }
  try { await S.db.collection(col).doc(id).set(data); }
  catch(e){
    if(e && e.code==="invalid_argument" && S.canWrite===null){ S.readOnly=true; render(); toast("Du kannst hier nur lesen."); }
    else if(e && e.code==="quota_exceeded") toast("Speicher der Datenbank ist voll.");
    else toast("Speichern fehlgeschlagen ("+(e&&e.code||"Fehler")+").");
    throw e;
  }
}
async function remove(col,id){ try { await S.db.collection(col).doc(id).delete(); } catch(e){ toast("Löschen fehlgeschlagen."); throw e; } }
const canW = () => S.db && !S.readOnly && S.canWrite!==false;

function subscribe(col, key, map){
  S.db.collection(col).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id:d.id, ...clone(d.data()) }));
    if(map) map();
    if(!snap.metadata.fromCache) S.loaded[key]=true;
    updateConn(); render(); resolveNames();
  }, err => { S.loaded[key]="error"; updateConn(); render(); });
}
function updateConn(){
  const el=$("#conn"); if(!el) return;
  const keys=["projekte","proben","analysen","labore"];
  if(!S.db){ el.className="conn warn"; el.lastChild.textContent= S.dbTried? "Datenbank nicht erreichbar" : "Verbinde mit Datenbank …"; return; }
  if(keys.some(k=>S.loaded[k]==="error")){ el.className="conn warn"; el.lastChild.textContent="Verbindung gestört"; return; }
  if(keys.every(k=>S.loaded[k])){ el.className="conn ok"; el.lastChild.textContent = S.readOnly||S.canWrite===false ? "Verbunden · nur lesen" : "Verbunden · gemeinsamer Datenstand"; }
  else { el.className="conn"; el.lastChild.textContent="Lade Daten …"; }
}

async function boot(){
  render();
  const slow = setTimeout(()=>{ S.slow=true; render(); }, 10000);
  try {
    const [db,user,assets,sample] = await Promise.all(["db","user","assets","sample"].map(n=>window.claude&&window.claude.use? window.claude.use(n).catch(()=>null) : Promise.resolve(null)));
    S.db=db; S.user=user; S.assets=assets; S.sample=sample; S.dbTried=true;
    if(user){ try{ S.meId=await user.id(); }catch(e){} try{ S.canWrite=await user.can("data.write"); }catch(e){} try{ const me=await user.me(); $("#who").textContent = me.name? "Angemeldet als "+me.name : ""; }catch(e){} }
    if(db){
      subscribe("projekte","projekte");
      subscribe("proben","proben");
      subscribe("lieferanten","lieferanten");
      subscribe("analysen","analysen");
      subscribe("labore","labore");
      subscribe("auswertungen","auswertungen");
      subscribe("notizen","notizen");
      subscribe("kunden","kunden");
      subscribe("produkte","produkte");
      db.collection("einstellungen").onSnapshot(snap=>{ const d=snap.docs.find(x=>x.id==="ki"); S.ki = d? clone(d.data()) : {regeln:""}; const t=snap.docs.find(x=>x.id==="team"); const tm=t&&t.data().mitglieder; S.team = Array.isArray(tm)&&tm.length? tm.slice() : TEAM_DEFAULT.slice(); S.loaded.ki=true; render(); }, ()=>{});
    }
    clearTimeout(slow); S.slow=false;
  } catch(e){ clearTimeout(slow); }
  updateConn(); render();
}

function banner(){

// ---------- Ansicht: Proben ----------
function filteredProben(){
  const f=S.filter, q=f.q.trim().toLowerCase();
  return S.proben.filter(p=>{
    if(f.projekt && p.projektId!==f.projekt) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.labor && !(p.auftraege||[]).some(a=>a.labor===f.labor)) return false;
    if(q && ![p.nr,p.bezeichnung,liefName(p),p.variante,p.lagerort,p.material].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(b.nr||"").localeCompare(a.nr||""));
}
function vProben(){
  let h = '<div class="head"><div><h2>Proben</h2><div class="lede">Alle Proben mit Herkunft, Projektzuordnung, Lagerort, Laboraufträgen und Ergebnissen.</div></div><div class="actions">'+(canW()?'<button class="btn" data-act="newProbe">Probe erfassen</button>':'')+'</div></div>';
  h += '<div class="toolbar"><input id="fq" type="search" placeholder="Suche Nr., Bezeichnung, Lieferant …" value="'+esc(S.filter.q)+'" aria-label="Suche">'
    + '<select id="fprojekt" aria-label="Projekt"><option value="">Alle Projekte</option>'+S.projekte.map(p=>'<option value="'+esc(p.id)+'" '+(S.filter.projekt===p.id?"selected":"")+'>'+esc(p.kurz||p.titel)+'</option>').join("")+'</select>'
    + '<select id="fstatus" aria-label="Status"><option value="">Alle Status</option>'+PROBEN_STATUS.map(s=>'<option '+(S.filter.status===s[0]?"selected":"")+'>'+s[0]+'</option>').join("")+'</select>'
    + '<select id="flabor" aria-label="Labor"><option value="">Alle Labore</option>'+S.labore.map(l=>'<option value="'+esc(l.id)+'" '+(S.filter.labor===l.id?"selected":"")+'>'+esc(l.name)+'</option>').join("")+'</select></div>';
  const list = filteredProben();
  if(!S.proben.length) return h + '<div class="panel empty"><b>Noch keine Proben erfasst</b>'+(S.loaded.proben?'Wenn eine Lieferung eingeht, über „Probe erfassen“ anlegen und einem Projekt und Analyseset zuordnen.':'Daten werden geladen …')+'</div>';

  h += '<div class="tw"><table class="t"><thead><tr><th>Probe</th><th>Lieferant</th><th>Projekt / Set</th><th>Eingang</th><th>Lagerort</th><th>Labore</th><th>Status</th></tr></thead><tbody>';
  list.forEach(p=>{ const pj=proj(p.projektId), s=setOf(pj,p.setId);

  return h + '</tbody></table></div>';

function nextNr(){
  const y = new Date().getFullYear(); const pre="RS-"+y+"-";
  const max = S.proben.map(p=>p.nr||"").filter(n=>n.startsWith(pre)).map(n=>parseInt(n.slice(pre.length),10)||0).reduce((a,b)=>Math.max(a,b),0);
  return pre+String(max+1).padStart(4,"0");
}

// ---------- Automatische Bewertung ----------
const ekey = e => e.code+(e.parameter?" "+e.parameter:"")+(e.einheit?" ["+e.einheit+"]":"");
const num = v => { if(v==null) return null; const s=String(v).trim().replace(/\s/g,"").replace(",","."); if(/^[<>]/.test(s)) return null; const n=parseFloat(s); return isFinite(n)? n : null; };
function evalSoll(e){
  const a = ana(e.code); const v = num(e.wert);
  if(!a || (a.sollMin==null && a.sollMax==null) || (a.sollMin===""&&a.sollMax==="")) return {state:"none", html:'<span class="sub">kein Sollbereich</span>'};
  if(v==null) return {state:"none", html:'<span class="sub">nicht numerisch</span>'};
  const lo = num(a.sollMin), hi = num(a.sollMax);
  const rng = (lo!=null?String(a.sollMin):"")+" … "+(hi!=null?String(a.sollMax):"");
  if(lo!=null && v<lo) return {state:"low", html:'<span class="pill p-warn">unter Soll</span><span class="sub">'+esc(rng)+'</span>'};
  if(hi!=null && v>hi) return {state:"high", html:'<span class="pill p-warn">über Soll</span><span class="sub">'+esc(rng)+'</span>'};
  return {state:"ok", html:'<span class="pill p-s1">im Soll</span><span class="sub">'+esc(rng)+'</span>'};
}
function controlMeans(p){
  // Mittelwerte der Kontrollproben im selben Projekt und Set
  if(!p || !p.projektId || p.kontrolle) return {};
  const ctrl = S.proben.filter(x=>x.kontrolle && x.projektId===p.projektId && (x.setId===p.setId || !p.setId) && x.id!==p.id);
  const acc = {};
  ctrl.forEach(c=>(c.ergebnisse||[]).forEach(e=>{ const n=num(e.wert); if(n==null) return; const k=ekey(e); (acc[k]=acc[k]||[]).push(n); }));
  const out={}; for(const k in acc) out[k]=acc[k].reduce((a,b)=>a+b,0)/acc[k].length; return out;
}
function deltaHtml(wert, ref){
  const v=num(wert); if(v==null || ref==null) return '<span class="sub">–</span>';
  if(ref===0) return '<span class="sub">Kontrolle 0</span>';
  const d=(v-ref)/Math.abs(ref)*100; const s=(d>0?"+":"")+d.toLocaleString("de-DE",{maximumFractionDigits:1})+" %";
  return '<span class="mono" style="color:'+(Math.abs(d)<5?"var(--muted)":d>0?"var(--s1)":"var(--s2)")+'">'+s+'</span><span class="sub">Kontrolle '+ref.toLocaleString("de-DE",{maximumFractionDigits:3})+'</span>';
}
const row = (k,v) => '<tr><td style="color:var(--muted);width:38%">'+k+'</td><td>'+v+'</td></tr>';
const sectionH = t => '<h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px">'+t+'</h4>';

// ---------- Ansicht: KI-Auswertung ----------
function resultMatrix(pid, setId){
  const proben = S.proben.filter(p=>p.projektId===pid && (!setId || p.setId===setId)).sort((a,b)=>(a.nr||"").localeCompare(b.nr||""));
  const cols = [];
  proben.forEach(p=>(p.ergebnisse||[]).forEach(e=>{ const k=ekey(e); if(!cols.includes(k)) cols.push(k); }));
  const rows = proben.map(p=>{ const m={}, ev={}, de={}; const ref=controlMeans(p);
    (p.ergebnisse||[]).forEach(e=>{ const k=ekey(e); m[k]=m[k]? m[k]+" / "+e.wert : e.wert; ev[k]=evalSoll(e).state; const v=num(e.wert); if(v!=null&&ref[k]!=null&&ref[k]!==0) de[k]=(v-ref[k])/Math.abs(ref[k])*100; });
    return {p,m,ev,de}; });
  rows.sort((a,b)=>(b.p.kontrolle?1:0)-(a.p.kontrolle?1:0));
  return {proben, cols, rows};
}
function vAuswertung(){
  const p = proj(S.kiSel.projekt); const s = setOf(p,S.kiSel.set);
  let h = '<div class="head"><div><h2>KI-Auswertung</h2><div class="lede">Claude wertet die eingetragenen Ergebnisse eines Analysesets vor dem Hintergrund der Forschungsfrage aus. Die Auswertungsregeln unten sind das, was die KI dazulernt: Sie gehen in jede Auswertung ein und werden mit jeder Korrektur genauer.</div></div></div>';
  h += '<div class="toolbar"><select id="kiP" aria-label="Projekt"><option value="">Projekt wählen</option>'+S.projekte.map(x=>'<option value="'+esc(x.id)+'" '+(S.kiSel.projekt===x.id?"selected":"")+'>'+esc(x.nr+" · "+(x.kurz||x.titel))+'</option>').join("")+'</select>'
    + '<select id="kiS" aria-label="Analyseset"><option value="">Alle Sets</option>'+((p&&p.sets)||[]).map(x=>'<option value="'+esc(x.id)+'" '+(S.kiSel.set===x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></div>';
  if(!p) return h + '<div class="panel empty"><b>Projekt wählen</b>Dann erscheinen die Ergebnisse als Tabelle und können ausgewertet werden.</div>' + kiRegeln() + kiHistory(null);
  const m = resultMatrix(p.id, s?s.id:"");
  h += '<div class="panel"><h3>Ergebnisse '+esc(s? s.name : "aller Sets")+'</h3>';
  if(s) h += '<p class="sub" style="margin:-4px 0 10px">Forschungsfrage: '+esc(s.frage||"–")+'</p>';
  if(!m.cols.length) h += '<div class="empty">Für diese Auswahl sind noch keine Ergebnisse eingetragen.</div>';
  else { h += '<div class="tw"><table class="t"><thead><tr><th>Probe</th>'+m.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>';
    m.rows.forEach(r=>{ h += '<tr class="click" data-probe="'+esc(r.p.id)+'" tabindex="0"><td class="mono">'+esc(r.p.nr)+(r.p.kontrolle?' <span class="pill p-s3">Kontrolle</span>':'')+'<span class="sub" style="font-family:var(--f-body)">'+esc(r.p.variante||r.p.bezeichnung)+'</span></td>'+m.cols.map(c=>{ const st=r.ev[c]; const col= st==="ok"?"var(--s1)":(st==="low"||st==="high")?"var(--warn)":"var(--fg)"; const d=r.de[c]; return '<td class="num"><span style="color:'+col+'">'+esc(r.m[c]||"–")+'</span>'+(d!=null?'<span class="sub">'+(d>0?"+":"")+d.toLocaleString("de-DE",{maximumFractionDigits:1})+' % ggü. Kontrolle</span>':'')+'</td>'; }).join("")+'</tr>'; });
    h += '</tbody></table></div><p class="sub" style="margin-top:8px">Grün: im Sollbereich der Analyse. Gelb: außerhalb. Prozentwerte: Abweichung vom Mittel der Kontrollproben desselben Sets. Sollbereiche tragt ihr je Analyse ein.</p>'; }
  h += '<div class="actions" style="margin-top:12px">';
  if(S.sample && m.cols.length) h += S.kiBusy? '<button class="btn ghost" id="kiStop">Stopp</button>' : '<button class="btn" id="kiRun">Mit Claude auswerten</button>';
  else if(!S.sample) h += '<span class="sub">Die KI-Auswertung ist in dieser Ansicht nicht verfügbar.</span>';
  h += '</div>';
  if(S.kiText || S.kiBusy){ h += '<h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px">Auswertung (Entwurf, fachlich zu prüfen)</h4><div class="ki-out" id="kiOut">'+esc(S.kiText||"Claude denkt nach …")+'</div>';
    if(S.kiText && !S.kiBusy && canW()) h += '<div class="actions" style="margin-top:10px"><button class="btn ghost" id="kiSave">Auswertung im Projekt speichern</button></div>'; }
  h += '</div>';
  return h + kiRegeln() + kiHistory(p.id);
}
function kiRegeln(){
  return '<div class="panel"><h3>Auswertungsregeln</h3><p class="sub" style="margin:-4px 0 10px">Fachliche Vorgaben, Richtwerte und Korrekturen, die Claude bei jeder Auswertung beachten soll. Beispiel: „Wasserdurchlässigkeit von Rasentragschichten immer gegen die Anforderung der DIN 18035-4 prüfen.“</p>'
   + '<textarea id="kiRegeln" style="width:100%;min-height:110px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px" '+(canW()?"":"readonly")+' aria-label="Auswertungsregeln">'+esc(S.ki.regeln||"")+'</textarea>'
   + (canW()?'<div class="actions" style="margin-top:8px"><button class="btn ghost sm" id="kiRegelnSave">Regeln speichern</button></div>':'')+'</div>';

function kiHistory(pid){
  const list = S.auswertungen.filter(a=>!pid||a.projektId===pid).sort((a,b)=>(b.when||"").localeCompare(a.when||""));
  if(!list.length) return '';
  return '<div class="panel"><h3>Gespeicherte Auswertungen</h3><div class="notes">'+list.map(a=>{ const p=proj(a.projektId), s=setOf(p,a.setId); return '<details class="note"><summary style="cursor:pointer"><b>'+esc((p?p.kurz||p.titel:"–")+(s?" · "+s.name:""))+'</b> <span class="sub" style="display:inline">'+esc(nameOf(a.who))+' · '+fmtDT(a.when)+'</span></summary><div style="white-space:pre-wrap;margin-top:8px">'+esc(a.text)+'</div></details>'; }).join("")+'</div></div>';
}
function buildPrompt(p, s, m){
  const codes = new Set(); m.rows.forEach(r=>(r.p.ergebnisse||[]).forEach(e=>codes.add(e.code)));
  const anaTxt = [...codes].map(c=>{ const a=ana(c); return a? "- "+c+" ("+a.name+"): "+(a.wozu||"")+" Norm: "+(a.norm||"offen")+((a.sollMin||a.sollMax)? " Sollbereich: "+(a.sollMin||"")+" bis "+(a.sollMax||"")+" "+(a.einheit||"")+(a.sollBezug?" ("+a.sollBezug+")":"") : " Sollbereich: nicht festgelegt") : "- "+c; }).join("\n");
  const table = ["Probe | Rolle | Variante | "+m.cols.join(" | ")].concat(m.rows.map(r=>r.p.nr+" | "+(r.p.kontrolle?"Kontrolle":"Variante")+" | "+(r.p.variante||r.p.bezeichnung||"")+" | "+m.cols.map(c=>r.m[c]||"–").join(" | "))).join("\n");
  const notes = m.rows.map(r=>(r.p.notizen||[]).map(n=>r.p.nr+": "+n.text).join("\n")).filter(Boolean).join("\n");
  return ("Du bist Fachgutachter für Bodenkunde und Substrattechnik und wertest Laborergebnisse für die Produktentwicklung der ReSoilution GmbH aus.\n\n"
    + "REGELN\n- Schreibe auf Deutsch, sachlich, als zusammenhängenden Fließtext mit kurzen Zwischenüberschriften.\n- Verwende niemals ein Semikolon.\n- Erfinde keine Messwerte, Normwerte oder Grenzwerte. Wenn ein Bewertungsmaßstab fehlt, sage das ausdrücklich.\n- Kennzeichne Unsicherheiten, fehlende Wiederholungen und Lücken deutlich.\n"
    + (S.ki.regeln? "\nFACHLICHE AUSWERTUNGSREGELN DES TEAMS\n"+S.ki.regeln+"\n" : "")
    + "\nPROJEKT\n"+p.titel+"\nForschungsfragen: "+(p.forschungsfragen||"–")+"\nErwartung: "+(p.erwartung||"–")+"\n"
    + (s? "\nANALYSESET\n"+s.name+"\nForschungsfrage: "+(s.frage||"–")+"\nErwartung: "+(s.erwartung||"–")+"\n" : "")
    + "\nANALYSEN\n"+anaTxt+"\n\nERGEBNISSE\n"+table+"\n"+(notes? "\nNOTIZEN ZU DEN PROBEN\n"+notes+"\n" : "")
    + "\nAUFGABE\nGliedere in: 1. Befund (was die Daten zeigen, Vergleich der Varianten mit der Kontrolle bzw. dem Grundsubstrat), 2. Bezug zur Forschungsfrage und zur Erwartung, 3. Plausibilität und Auffälligkeiten, 4. Unsicherheiten und Datenlücken, 5. Empfohlene nächste Schritte.").slice(0, 120000);
}

  return h + '</tbody></table></div>';
}
function showKunde(id){
  const k = kunde(id); if(!k){ closeModal(); return; }
  let h = '<div class="mh"><div><span class="lab-tag">Kunde</span><h3>'+esc(k.name)+'</h3></div><button class="xbtn" data-close aria-label="Schließen">×</button></div>';
  h += '<div class="tw"><table class="t"><tbody>'+row("Standort",esc(k.standort||"–"))+row("Adresse",esc(adr(k)||"–"))+row("Land",esc(k.land||"–"))+row("Branche",esc(k.branche||"–"))+row("Ansprechpartner",esc(k.ansprechpartner||"–"))+row("Telefon",esc(k.telefon||"–"))+row("E-Mail",esc(k.email||"–"))+(k.notiz?row("Notiz",esc(k.notiz).replace(/\n/g,"<br>")):"")+'</tbody></table></div>';
  h += notesBlock("kunden", k);
  h += '<div class="mf">'+(canW()?'<button class="btn ghost" data-editkunde="'+esc(id)+'">Bearbeiten</button>':'')+'<button class="btn" data-close>Schließen</button></div>';
  openModal(h, ()=>showKunde(id));
}
function editKunde(id){
  const k = id? clone(kunde(id)) : {land:"Deutschland"};
  let h = '<div class="mh"><h3>'+(id?"Kunde bearbeiten":"Kunde anlegen")+'</h3><button class="xbtn" data-close aria-label="Schließen">×</button></div><form id="fKunde" class="form">'
    + fld("name","Name / Firma",k.name,"full",true)
    + fld("standort","Standort",k.standort,"","z.B. Zentrale, Golfplatz, Werk")
    + fld("branche","Branche",k.branche,"","z.B. Golfplatz, Garten- und Landschaftsbau")
    + fld("strasse","Straße und Hausnummer",k.strasse,"full")
    + fld("plz","PLZ",k.plz) + fld("ort","Ort",k.ort)
    + fld("land","Land",k.land) + fld("ansprechpartner","Ansprechpartner",k.ansprechpartner)
    + fld("telefon","Telefon",k.telefon) + fld("email","E-Mail",k.email,"","","email")
    + area("notiz","Notiz",k.notiz)
    + '</form><div class="mf">'+(id?'<span class="left" id="delWrap"><button class="btn danger sm" data-askdel>Kunde löschen</button></span>':'')+'<button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="saveKunde">Speichern</button></div>';
  openModal(h);
  $("#saveKunde").onclick = async ()=>{ const f=formData("#fKunde"); if(!f.name){ toast("Bitte einen Namen angeben."); return; } Object.assign(k,f); delete k.id; const docId=id||S.db.collection("kunden").doc().id; await write("kunden",docId,k); toast("Kunde gespeichert"); showKunde(docId); };
  wireDelete(async()=>{ await remove("kunden",id); closeModal(); toast("Kunde gelöscht"); });
}

// ---------- Ansicht: Produkte ----------
const produkt = id => byId(S.produkte,id);
const PROD_STATUS = [["in Entwicklung","p-s2"],["in Erprobung","p-warn"],["am Markt","p-s1"],["eingestellt","p-mute"]];
function vProdukte(){
  let h = '<div class="head"><div><h2>Produkte</h2><div class="lede">Die Produkte der ReSoilution GmbH: Bodenhilfsstoffe und Lösungen zur Schadstoffbindung mit Status und Beschreibung.</div></div><div class="actions">'+(canW()?'<button class="btn" data-act="newProdukt">Produkt anlegen</button>':'')+'</div></div>';
  h += '<div class="toolbar"><input id="pq" type="search" placeholder="Suche Name, Kategorie …" value="'+esc(S.pFilter.q||"")+'" aria-label="Produkte suchen"></div>';
  if(!S.produkte.length) return h + '<div class="panel empty"><b>Noch keine Produkte</b>'+(S.loaded.produkte?'Lege das erste Produkt an.':'Daten werden geladen …')+'</div>';
  const q=(S.pFilter.q||"").trim().toLowerCase();
  const list = S.produkte.filter(p=>(!q || [p.name,p.kategorie,p.beschreibung,p.kurz].join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(!list.length) return h + '<div class="panel empty">Kein Produkt passt zur Suche.</div>';
  h += '<div class="ana-list">';
  list.forEach(p=>{ h += '<button class="acard" data-produkt="'+esc(p.id)+'">'+pill(p.status,PROD_STATUS)+'<b style="margin-top:6px">'+esc(p.name)+'</b>'+(p.kategorie?'<code>'+esc(p.kategorie)+'</code>':'')+'<span class="sub">'+esc((p.beschreibung||"").slice(0,120))+((p.beschreibung||"").length>120?" …":"")+'</span></button>'; });
  return h + '</div>';
}
function showProdukt(id){
  const p = produkt(id); if(!p){ closeModal(); return; }
  let h = '<div class="mh"><div><span class="lab-tag">Produkt</span> '+pill(p.status,PROD_STATUS)+'<h3>'+esc(p.name)+'</h3></div><button class="xbtn" data-close aria-label="Schließen">×</button></div>';
  h += '<div class="tw"><table class="t"><tbody>'+row("Kategorie",esc(p.kategorie||"–"))+row("Einheit / Gebinde",esc(p.einheit||"–"))+row("Status",esc(p.status||"–"))+(p.inhaltsstoffe?row("Inhaltsstoffe / Basis",esc(p.inhaltsstoffe)):"")+'</tbody></table></div>';
  h += '<div class="detail"><h4>Beschreibung</h4><p>'+esc(p.beschreibung||"noch nicht beschrieben")+'</p>'+(p.anwendung?'<h4>Anwendung</h4><p>'+esc(p.anwendung)+'</p>':'')+'</div>';
  h += notesBlock("produkte", p);
  h += '<div class="mf">'+(canW()?'<button class="btn ghost" data-editprodukt="'+esc(id)+'">Bearbeiten</button>':'')+'<button class="btn" data-close>Schließen</button></div>';
  openModal(h, ()=>showProdukt(id));
}
function editProdukt(id){
  const p = id? clone(produkt(id)) : {status:"in Entwicklung"};
  let h = '<div class="mh"><h3>'+(id?"Produkt bearbeiten":"Produkt anlegen")+'</h3><button class="xbtn" data-close aria-label="Schließen">×</button></div><form id="fProd" class="form">'
    + fld("name","Name",p.name,"full",true)
    + fld("kategorie","Kategorie",p.kategorie,"","z.B. Bodenhilfsstoff, Schadstoffbindung")
    + sel("status","Status",PROD_STATUS.map(x=>x[0]),p.status)
    + fld("einheit","Einheit / Gebinde",p.einheit,"","z.B. Sack 25 kg, BigBag")
    + fld("inhaltsstoffe","Inhaltsstoffe / Basis",p.inhaltsstoffe,"full")
    + area("beschreibung","Beschreibung",p.beschreibung) + area("anwendung","Anwendung",p.anwendung)
    + '</form><div class="mf">'+(id?'<span class="left" id="delWrap"><button class="btn danger sm" data-askdel>Produkt löschen</button></span>':'')+'<button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="saveProd">Speichern</button></div>';
  openModal(h);
  $("#saveProd").onclick = async ()=>{ const f=formData("#fProd"); if(!f.name){ toast("Bitte einen Namen angeben."); return; } Object.assign(p,f); delete p.id; const docId=id||S.db.collection("produkte").doc().id; await write("produkte",docId,p); toast("Produkt gespeichert"); showProdukt(docId); };
  wireDelete(async()=>{ await remove("produkte",id); closeModal(); toast("Produkt gelöscht"); });
}

// ---------- Formular-Helfer ----------
function fld(name,label,val,cls,req,type){ const ph = (typeof req==="string")? req : ""; return '<div class="f '+(cls||"")+'"><label for="i-'+name+'">'+label+'</label><input id="i-'+name+'" name="'+name+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'" '+(req===true?"required":"")+' placeholder="'+esc(ph)+'"></div>'; }
function area(name,label,val,cls){ return '<div class="f '+(cls===undefined?"full":cls)+'"><label for="i-'+name+'">'+label+'</label><textarea id="i-'+name+'" name="'+name+'">'+esc(val||"")+'</textarea></div>'; }
function sel(name,label,opts,val,blank){ return '<div class="f"><label for="i-'+name+'">'+label+'</label><select id="i-'+name+'" name="'+name+'">'+(blank?'<option value="">— wählen —</option>':'')+opts.map(o=>'<option '+(o===val?"selected":"")+'>'+esc(o)+'</option>').join("")+'</select></div>'; }
function formData(sel){ const o={}; new FormData(document.querySelector(sel)).forEach((v,k)=>{ if(k!=="an") o[k]=String(v).trim(); }); return o; }

let modalRerender = null;
function openModal(html, rerender){ modalRerender = rerender||null; $("#modalRoot").innerHTML = '<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>'; const f=document.querySelector("#modalRoot .modal input, #modalRoot .modal select, #modalRoot .modal textarea, #modalRoot .modal button"); }
function closeModal(){ $("#modalRoot").innerHTML=""; modalRerender=null; }
function wireDelete(fn){ const w=document.querySelector("#delWrap"); if(!w) return; w.querySelector("[data-askdel]").onclick=()=>{ w.innerHTML='<span class="confirm">Wirklich löschen? <button class="btn danger sm" id="yesDel">Ja, löschen</button><button class="btn ghost sm" id="noDel">Nein</button></span>'; $("#yesDel").onclick=fn; $("#noDel").onclick=()=>{ w.innerHTML='<button class="btn danger sm" data-askdel>Löschen</button>'; wireDelete(fn); }; }; }

// Live-Aktualisierung offener Detailfenster, ohne Eingaben zu verlieren
const _render = render;
render = function(){ _render(); if(modalRerender){ const m=$("#modalRoot"); const busy = m.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement.value; if(!busy){ const st=document.querySelector("#mbg")?.scrollTop||0; modalRerender(); const b=document.querySelector("#mbg"); if(b) b.scrollTop=st; } } };

// ---------- Ereignisse ----------
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-act],[data-lief],[data-editlief],[data-kunde],[data-editkunde],[data-produkt],[data-editprodukt],[data-probe],[data-projekt],[data-notiz],[data-kpi],[data-ana],[data-close],[data-editset],[data-editprojekt],[data-editana],[data-editlab],[data-addnote],#kiRun,#kiStop,#kiSave,#kiRegelnSave");
  if(e.target.id==="mbg"){ closeModal(); return; }
  if(!t) return;
  if(t.hasAttribute("data-close")){ closeModal(); return; }
  if(t.hasAttribute("data-kpi")){ if(t.dataset.navstatus!==undefined) S.filter.status=t.dataset.navstatus; return; }
  const act=t.dataset.act;
  if(act==="newProbe") return editProbe(null, S.filter.projekt? {projektId:S.filter.projekt} : null);
  if(act==="newNotiz") return editNotiz(null);
  if(act==="newProjekt") return editProjekt(null);
  if(act==="newLieferant") return editLieferant(null);
  if(act==="newKunde") return editKunde(null);
  if(act==="newProdukt") return editProdukt(null);
  if(act==="newProbeFrom") return editProbe(null, {lieferantId:t.dataset.lid});
  if(t.dataset.editlief) return editLieferant(t.dataset.editlief);
  if(t.dataset.lief){ e.preventDefault(); return showLieferant(t.dataset.lief); }
  if(t.dataset.editkunde) return editKunde(t.dataset.editkunde);
  if(t.dataset.kunde) return showKunde(t.dataset.kunde);
  if(t.dataset.editprodukt) return editProdukt(t.dataset.editprodukt);
  if(t.dataset.produkt) return showProdukt(t.dataset.produkt);
  if(act==="newAnalyse") return editAnalyse(null);
  if(act==="newLabor") return editLabor(null);
  if(t.dataset.probe) return showProbe(t.dataset.probe);
  if(t.dataset.projekt) return showProjekt(t.dataset.projekt);
  if(t.dataset.notiz) return editNotiz(t.dataset.notiz);
  if(t.dataset.ana) return showAnalyse(t.dataset.ana);
  if(t.dataset.editset!==undefined) return editSet(t.dataset.pid, t.dataset.editset);
  if(t.dataset.editprojekt) return editProjekt(t.dataset.editprojekt);
  if(t.dataset.editana) return editAnalyse(t.dataset.editana);
  if(t.dataset.editlab) return editLabor(t.dataset.editlab);
  if(t.dataset.addnote){ const txt=$("#noteTxt").value.trim(); if(!txt) return; const col=t.dataset.addnote, id=t.dataset.doc; const src=byId(S[col],id); const d=clone(src); delete d.id; d.notizen=d.notizen||[]; d.notizen.push({when:new Date().toISOString(), who:S.meId||"", text:txt}); $("#noteTxt").value=""; await write(col,id,d); toast("Notiz gespeichert"); return; }
  if(t.id==="kiRegelnSave"){ await write("einstellungen","ki",{regeln:$("#kiRegeln").value}); toast("Regeln gespeichert"); return; }
  if(t.id==="kiStop"){ S.kiCtl&&S.kiCtl.abort(); return; }
  if(t.id==="kiSave"){ const id=S.db.collection("auswertungen").doc().id; await write("auswertungen",id,{projektId:S.kiSel.projekt, setId:S.kiSel.set, when:new Date().toISOString(), who:S.meId||"", text:S.kiText}); S.kiText=""; render(); toast("Auswertung gespeichert"); return; }
  if(t.id==="kiRun"){
    const p=proj(S.kiSel.projekt), s=setOf(p,S.kiSel.set), m=resultMatrix(p.id, s?s.id:"");
    S.kiBusy=true; S.kiText=""; S.kiCtl=new AbortController(); render();
    try { const r = await S.sample(buildPrompt(p,s,m), {signal:S.kiCtl.signal, modelTier:"complex", cache:false, onText:({text})=>{ S.kiText=text; const o=$("#kiOut"); if(o) o.textContent=text; }}); S.kiText=r.text+(r.truncated?"\n\n[Die Antwort wurde gekürzt. Bitte ein einzelnes Set auswerten.]":""); }
    catch(err){ S.kiText = err&&err.text? err.text : ""; const m2={not_granted:"Die KI-Auswertung wurde nicht freigegeben.",rate_limited:"Gerade zu viele Anfragen. Bitte später erneut versuchen.",prompt_too_large:"Zu viele Daten auf einmal. Bitte ein einzelnes Set wählen.",refused:"Claude hat die Anfrage abgelehnt."}; if(!(err&&err.code==="cancelled")) toast(m2[err&&err.code]||"Die Auswertung ist fehlgeschlagen."); if(err&&err.code==="not_granted") S.sample=null; }
    S.kiBusy=false; render(); return;
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); if(e.key==="Enter" && e.target.matches && e.target.matches("tr.click,.chip[data-ana],a[data-lief]")) e.target.click(); });
document.addEventListener("input", e=>{ if(e.target.id==="fq"){ S.filter.q=e.target.value; render(); } if(e.target.id==="lq"){ S.filter.lq=e.target.value; render(); } if(e.target.id==="kq"){ S.kFilter.q=e.target.value; render(); } if(e.target.id==="pq"){ S.pFilter.q=e.target.value; render(); } });
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="fprojekt"){ S.filter.projekt=e.target.value; render(); }
  if(id==="fstatus"){ S.filter.status=e.target.value; render(); }
  if(id==="flabor"){ S.filter.labor=e.target.value; render(); }
  if(id==="lland"){ S.filter.lland=e.target.value; render(); }
  if(id==="kland"){ S.kFilter.land=e.target.value; render(); }
  if(id==="aProjekt"){ S.aFilter.projekt=e.target.value; render(); }
  if(id==="aKat"){ S.aFilter.kategorie=e.target.value; render(); }
  if(id==="kiP"){ S.kiSel.projekt=e.target.value; S.kiSel.set=""; S.kiText=""; render(); }
  if(id==="kiS"){ S.kiSel.set=e.target.value; S.kiText=""; render(); }
});

boot();
})();
</script>

</body>
</html>
