<style>
  /* Layout: Seitenleiste mit Bereichen (wie Projektmanagement Boden und Umwelt), rechts Arbeitsfläche mit Tabellen, Detail im Modal */
  /* bewusst durchgehend dunkel, gleiche Welt wie das Untersuchungsprogramm */
  :root{

    body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

// ---------- Datenbank ----------
async function write(col, id, data){
  if(!S.db){ toast("Keine Verbindung zur Datenbank."); throw new Error("no db"); }
  try { await S.db.collection(col).doc(id).set(data); }
  catch(e){
    if(e && e.code==="invalid_argument" && S.canWrite===null){ S.readOnly=true; render(); toast("Du kannst hier nur lesen."); }
    else if(e && e.code==="quota_exceeded") toast("Speicher der Datenbank ist voll.");
    else toast("Speichern fehlgeschlagen ("+(e&&e.code||"Fehler")+").");
    throw e;
  }
}
async function remove(col,id){ try { await S.db.collection(col).doc(id).delete(); } catch(e){ toast("Löschen fehlgeschlagen."); throw e; } }
const canW = () => S.db && !S.readOnly && S.canWrite!==false;

function subscribe(col, key, map){
  S.db.collection(col).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id:d.id, ...clone(d.data()) }));
    if(map) map();
    if(!snap.metadata.fromCache) S.loaded[key]=true;
    updateConn(); render(); resolveNames();
  }, err => { S.loaded[key]="error"; updateConn(); render(); });
}
function updateConn(){
  const el=$("#conn"); if(!el) return;
  const keys=["projekte","proben","analysen","labore"];
  if(!S.db){ el.className="conn warn"; el.lastChild.textContent= S.dbTried? "Datenbank nicht erreichbar" : "Verbinde mit Datenbank …"; return; }
  if(keys.some(k=>S.loaded[k]==="error")){ el.className="conn warn"; el.lastChild.textContent="Verbindung gestört"; return; }
  if(keys.every(k=>S.loaded[k])){ el.className="conn ok"; el.lastChild.textContent = S.readOnly||S.canWrite===false ? "Verbunden · nur lesen" : "Verbunden · gemeinsamer Datenstand"; }
  else { el.className="conn"; el.lastChild.textContent="Lade Daten …"; }
}

  h += '<h4>Erwartete Ergebnisse</h4><p>'+esc(p.erwartung||"noch nicht beschrieben")+'</p>';
  if(p.verantwortung) h += '<h4>Verantwortung</h4><p>'+esc(p.verantwortung)+'</p>';
  h += '</div><h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px">Analysesets</h4><div class="sets">';

  });
  if(!(p.sets||[]).length) h += '<div class="empty">Noch keine Analysesets.</div>';
  h += '</div>';
  if(canW()) h += '<div style="margin-top:10px"><button class="btn ghost sm" data-editset="" data-pid="'+esc(p.id)+'">Analyseset hinzufügen</button></div>';
  h += '<h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px">Proben ('+proben.length+')</h4>';
  if(proben.length){ h += '<div class="tw"><table class="t"><thead><tr><th>Probe</th><th>Set</th><th>Eingang</th><th>Status</th></tr></thead><tbody>';
    proben.forEach(x=>{ const s=setOf(p,x.setId); h+='<tr class="click" data-probe="'+esc(x.id)+'" tabindex="0"><td class="mono">'+esc(x.nr)+'<span class="sub">'+esc(x.bezeichnung)+(x.variante?' · '+esc(x.variante):'')+'</span></td><td>'+esc(s?s.name:"–")+'</td><td>'+fmtD(x.eingang)+'</td><td>'+pill(x.status,PROBEN_STATUS)+'</td></tr>'; });
    h += '</tbody></table></div>'; }
  else h += '<div class="empty">Diesem Projekt sind noch keine Proben zugeordnet.</div>';
  h += notesBlock("projekte", p);
  h += '<div class="mf">'+(canW()?'<button class="btn ghost" data-editprojekt="'+esc(p.id)+'">Projekt bearbeiten</button>':'')+'<button class="btn" data-close>Schließen</button></div>';

// ---------- Ansicht: Proben ----------
function filteredProben(){
  const f=S.filter, q=f.q.trim().toLowerCase();
  return S.proben.filter(p=>{
    if(f.projekt && p.projektId!==f.projekt) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.labor && !(p.auftraege||[]).some(a=>a.labor===f.labor)) return false;
    if(q && ![p.nr,p.bezeichnung,liefName(p),p.variante,p.lagerort,p.material].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(b.nr||"").localeCompare(a.nr||""));
}
function vProben(){
  let h = '<div class="head"><div><h2>Proben</h2><div class="lede">Alle Proben mit Herkunft, Projektzuordnung, Lagerort, Laboraufträgen und Ergebnissen.</div></div><div class="actions">'+(canW()?'<button class="btn" data-act="newProbe">Probe erfassen</button>':'')+'</div></div>';
  h += '<div class="toolbar"><input id="fq" type="search" placeholder="Suche Nr., Bezeichnung, Lieferant …" value="'+esc(S.filter.q)+'" aria-label="Suche">'
    + '<select id="fprojekt" aria-label="Projekt"><option value="">Alle Projekte</option>'+S.projekte.map(p=>'<option value="'+esc(p.id)+'" '+(S.filter.projekt===p.id?"selected":"")+'>'+esc(p.kurz||p.titel)+'</option>').join("")+'</select>'
    + '<select id="fstatus" aria-label="Status"><option value="">Alle Status</option>'+PROBEN_STATUS.map(s=>'<option '+(S.filter.status===s[0]?"selected":"")+'>'+s[0]+'</option>').join("")+'</select>'
    + '<select id="flabor" aria-label="Labor"><option value="">Alle Labore</option>'+S.labore.map(l=>'<option value="'+esc(l.id)+'" '+(S.filter.labor===l.id?"selected":"")+'>'+esc(l.name)+'</option>').join("")+'</select></div>';
  const list = filteredProben();
  if(!S.proben.length) return h + '<div class="panel empty"><b>Noch keine Proben erfasst</b>'+(S.loaded.proben?'Wenn eine Lieferung eingeht, über „Probe erfassen“ anlegen und einem Projekt und Analyseset zuordnen.':'Daten werden geladen …')+'</div>';
  if(!list.length) return h + '<div class="panel empty">Keine Probe passt zu den Filtern.</div>';
  h += '<div class="tw"><table class="t"><thead><tr><th>Probe</th><th>Lieferant</th><th>Projekt / Set</th><th>Eingang</th><th>Lagerort</th><th>Labore</th><th>Status</th></tr></thead><tbody>';
  list.forEach(p=>{ const pj=proj(p.projektId), s=setOf(pj,p.setId);
    const labs=[...new Set((p.auftraege||[]).map(a=>{const l=lab(a.labor);return l?l.kurz||l.name:"";}).filter(Boolean))];
    h += '<tr class="click" data-probe="'+esc(p.id)+'" tabindex="0"><td class="mono">'+esc(p.nr)+'<span class="sub" style="font-family:var(--f-body)">'+esc(p.bezeichnung)+(p.variante?' · '+esc(p.variante):'')+'</span></td><td>'+esc(liefName(p)||"–")+'</td><td>'+esc(pj?pj.kurz||pj.titel:"–")+'<span class="sub">'+esc(s?s.name:"")+'</span></td><td>'+fmtD(p.eingang)+'</td><td>'+esc(p.lagerort||"–")+'</td><td>'+esc(labs.join(", ")||"–")+'</td><td>'+pill(p.status,PROBEN_STATUS)+'</td></tr>'; });
  return h + '</tbody></table></div>';
}

function nextNr(){
  const y = new Date().getFullYear(); const pre="RS-"+y+"-";
  const max = S.proben.map(p=>p.nr||"").filter(n=>n.startsWith(pre)).map(n=>parseInt(n.slice(pre.length),10)||0).reduce((a,b)=>Math.max(a,b),0);
  return pre+String(max+1).padStart(4,"0");
}

function showProbe(id){

    + '</tbody></table></div>';

  // Fotos / Etiketten
  h += sectionH("Fotos / Etiketten");
  const fotos = p.fotos||[];
  h += '<div class="fotoGrid">'+fotos.map((f,i)=>'<div class="fotoItem"><a href="/_blob/'+esc(f.assetId)+'" target="_blank" rel="noopener"><img src="/_blob/'+esc(f.assetId)+'" alt="'+esc(f.name||"Foto")+'" loading="lazy"></a>'+(canW()?'<button class="fotoDel" data-delfoto="'+i+'" aria-label="Foto entfernen">×</button>':'')+'</div>').join("")+(fotos.length?'':'<span class="sub">Noch keine Fotos.</span>')+'</div>';

// ---------- Automatische Bewertung ----------
const ekey = e => e.code+(e.parameter?" "+e.parameter:"")+(e.einheit?" ["+e.einheit+"]":"");
const num = v => { if(v==null) return null; const s=String(v).trim().replace(/\s/g,"").replace(",","."); if(/^[<>]/.test(s)) return null; const n=parseFloat(s); return isFinite(n)? n : null; };
function evalSoll(e){
  const a = ana(e.code); const v = num(e.wert);
  if(!a || (a.sollMin==null && a.sollMax==null) || (a.sollMin===""&&a.sollMax==="")) return {state:"none", html:'<span class="sub">kein Sollbereich</span>'};
  if(v==null) return {state:"none", html:'<span class="sub">nicht numerisch</span>'};
  const lo = num(a.sollMin), hi = num(a.sollMax);
  const rng = (lo!=null?String(a.sollMin):"")+" … "+(hi!=null?String(a.sollMax):"");
  if(lo!=null && v<lo) return {state:"low", html:'<span class="pill p-warn">unter Soll</span><span class="sub">'+esc(rng)+'</span>'};
  if(hi!=null && v>hi) return {state:"high", html:'<span class="pill p-warn">über Soll</span><span class="sub">'+esc(rng)+'</span>'};
  return {state:"ok", html:'<span class="pill p-s1">im Soll</span><span class="sub">'+esc(rng)+'</span>'};
}
function controlMeans(p){
  // Mittelwerte der Kontrollproben im selben Projekt und Set
  if(!p || !p.projektId || p.kontrolle) return {};
  const ctrl = S.proben.filter(x=>x.kontrolle && x.projektId===p.projektId && (x.setId===p.setId || !p.setId) && x.id!==p.id);
  const acc = {};
  ctrl.forEach(c=>(c.ergebnisse||[]).forEach(e=>{ const n=num(e.wert); if(n==null) return; const k=ekey(e); (acc[k]=acc[k]||[]).push(n); }));
  const out={}; for(const k in acc) out[k]=acc[k].reduce((a,b)=>a+b,0)/acc[k].length; return out;
}
function deltaHtml(wert, ref){
  const v=num(wert); if(v==null || ref==null) return '<span class="sub">–</span>';
  if(ref===0) return '<span class="sub">Kontrolle 0</span>';
  const d=(v-ref)/Math.abs(ref)*100; const s=(d>0?"+":"")+d.toLocaleString("de-DE",{maximumFractionDigits:1})+" %";
  return '<span class="mono" style="color:'+(Math.abs(d)<5?"var(--muted)":d>0?"var(--s1)":"var(--s2)")+'">'+s+'</span><span class="sub">Kontrolle '+ref.toLocaleString("de-DE",{maximumFractionDigits:3})+'</span>';
}
const row = (k,v) => '<tr><td style="color:var(--muted);width:38%">'+k+'</td><td>'+v+'</td></tr>';
const sectionH = t => '<h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px">'+t+'</h4>';

function notesBlock(col, doc){
  let h = sectionH("Notizen");
  const n = (doc.notizen||[]).slice().sort((a,b)=>(b.when||"").localeCompare(a.when||""));
  h += '<div class="notes">'+(n.length? n.map(x=>'<div class="note"><div class="w">'+esc(nameOf(x.who))+' · '+fmtDT(x.when)+'</div>'+esc(x.text).replace(/\n/g,"<br>")+'</div>').join("") : '<div class="sub">Noch keine Notizen.</div>')+'</div>';
  if(canW()) h += '<div class="addnote"><textarea id="noteTxt" placeholder="Notiz hinzufügen …" aria-label="Notiz"></textarea><button class="btn sm" data-addnote="'+col+'" data-doc="'+esc(doc.id)+'">Speichern</button></div>';
  return h;
}

  const groups = {}; S.analysen.forEach(a=>{ const k=a.labor||"offen"; (groups[k]=groups[k]||[]).push(a); });
  const order = S.labore.map(l=>l.id).concat(["offen"]);

// ---------- Ansicht: KI-Auswertung ----------
function resultMatrix(pid, setId){
  const proben = S.proben.filter(p=>p.projektId===pid && (!setId || p.setId===setId)).sort((a,b)=>(a.nr||"").localeCompare(b.nr||""));
  const cols = [];
  proben.forEach(p=>(p.ergebnisse||[]).forEach(e=>{ const k=ekey(e); if(!cols.includes(k)) cols.push(k); }));
  const rows = proben.map(p=>{ const m={}, ev={}, de={}; const ref=controlMeans(p);
    (p.ergebnisse||[]).forEach(e=>{ const k=ekey(e); m[k]=m[k]? m[k]+" / "+e.wert : e.wert; ev[k]=evalSoll(e).state; const v=num(e.wert); if(v!=null&&ref[k]!=null&&ref[k]!==0) de[k]=(v-ref[k])/Math.abs(ref[k])*100; });
    return {p,m,ev,de}; });
  rows.sort((a,b)=>(b.p.kontrolle?1:0)-(a.p.kontrolle?1:0));
  return {proben, cols, rows};
}
function vAuswertung(){
  const p = proj(S.kiSel.projekt); const s = setOf(p,S.kiSel.set);
  let h = '<div class="head"><div><h2>KI-Auswertung</h2><div class="lede">Claude wertet die eingetragenen Ergebnisse eines Analysesets vor dem Hintergrund der Forschungsfrage aus. Die Auswertungsregeln unten sind das, was die KI dazulernt: Sie gehen in jede Auswertung ein und werden mit jeder Korrektur genauer.</div></div></div>';
  h += '<div class="toolbar"><select id="kiP" aria-label="Projekt"><option value="">Projekt wählen</option>'+S.projekte.map(x=>'<option value="'+esc(x.id)+'" '+(S.kiSel.projekt===x.id?"selected":"")+'>'+esc(x.nr+" · "+(x.kurz||x.titel))+'</option>').join("")+'</select>'
    + '<select id="kiS" aria-label="Analyseset"><option value="">Alle Sets</option>'+((p&&p.sets)||[]).map(x=>'<option value="'+esc(x.id)+'" '+(S.kiSel.set===x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></div>';
  if(!p) return h + '<div class="panel empty"><b>Projekt wählen</b>Dann erscheinen die Ergebnisse als Tabelle und können ausgewertet werden.</div>' + kiRegeln() + kiHistory(null);
  const m = resultMatrix(p.id, s?s.id:"");
  h += '<div class="panel"><h3>Ergebnisse '+esc(s? s.name : "aller Sets")+'</h3>';
  if(s) h += '<p class="sub" style="margin:-4px 0 10px">Forschungsfrage: '+esc(s.frage||"–")+'</p>';
  if(!m.cols.length) h += '<div class="empty">Für diese Auswahl sind noch keine Ergebnisse eingetragen.</div>';
  else { h += '<div class="tw"><table class="t"><thead><tr><th>Probe</th>'+m.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>';
    m.rows.forEach(r=>{ h += '<tr class="click" data-probe="'+esc(r.p.id)+'" tabindex="0"><td class="mono">'+esc(r.p.nr)+(r.p.kontrolle?' <span class="pill p-s3">Kontrolle</span>':'')+'<span class="sub" style="font-family:var(--f-body)">'+esc(r.p.variante||r.p.bezeichnung)+'</span></td>'+m.cols.map(c=>{ const st=r.ev[c]; const col= st==="ok"?"var(--s1)":(st==="low"||st==="high")?"var(--warn)":"var(--fg)"; const d=r.de[c]; return '<td class="num"><span style="color:'+col+'">'+esc(r.m[c]||"–")+'</span>'+(d!=null?'<span class="sub">'+(d>0?"+":"")+d.toLocaleString("de-DE",{maximumFractionDigits:1})+' % ggü. Kontrolle</span>':'')+'</td>'; }).join("")+'</tr>'; });
    h += '</tbody></table></div><p class="sub" style="margin-top:8px">Grün: im Sollbereich der Analyse. Gelb: außerhalb. Prozentwerte: Abweichung vom Mittel der Kontrollproben desselben Sets. Sollbereiche tragt ihr je Analyse ein.</p>'; }
  h += '<div class="actions" style="margin-top:12px">';
  if(S.sample && m.cols.length) h += S.kiBusy? '<button class="btn ghost" id="kiStop">Stopp</button>' : '<button class="btn" id="kiRun">Mit Claude auswerten</button>';
  else if(!S.sample) h += '<span class="sub">Die KI-Auswertung ist in dieser Ansicht nicht verfügbar.</span>';
  h += '</div>';
  if(S.kiText || S.kiBusy){ h += '<h4 style="font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px">Auswertung (Entwurf, fachlich zu prüfen)</h4><div class="ki-out" id="kiOut">'+esc(S.kiText||"Claude denkt nach …")+'</div>';
    if(S.kiText && !S.kiBusy && canW()) h += '<div class="actions" style="margin-top:10px"><button class="btn ghost" id="kiSave">Auswertung im Projekt speichern</button></div>'; }
  h += '</div>';
  return h + kiRegeln() + kiHistory(p.id);
}

function buildPrompt(p, s, m){
  const codes = new Set(); m.rows.forEach(r=>(r.p.ergebnisse||[]).forEach(e=>codes.add(e.code)));
  const anaTxt = [...codes].map(c=>{ const a=ana(c); return a? "- "+c+" ("+a.name+"): "+(a.wozu||"")+" Norm: "+(a.norm||"offen")+((a.sollMin||a.sollMax)? " Sollbereich: "+(a.sollMin||"")+" bis "+(a.sollMax||"")+" "+(a.einheit||"")+(a.sollBezug?" ("+a.sollBezug+")":"") : " Sollbereich: nicht festgelegt") : "- "+c; }).join("\n");

  const notes = m.rows.map(r=>(r.p.notizen||[]).map(n=>r.p.nr+": "+n.text).join("\n")).filter(Boolean).join("\n");
  return ("Du bist Fachgutachter für Bodenkunde und Substrattechnik und wertest Laborergebnisse für die Produktentwicklung der ReSoilution GmbH aus.\n\n"
    + "REGELN\n- Schreibe auf Deutsch, sachlich, als zusammenhängenden Fließtext mit kurzen Zwischenüberschriften.\n- Verwende niemals ein Semikolon.\n- Erfinde keine Messwerte, Normwerte oder Grenzwerte. Wenn ein Bewertungsmaßstab fehlt, sage das ausdrücklich.\n- Kennzeichne Unsicherheiten, fehlende Wiederholungen und Lücken deutlich.\n"
    + (S.ki.regeln? "\nFACHLICHE AUSWERTUNGSREGELN DES TEAMS\n"+S.ki.regeln+"\n" : "")
    + "\nPROJEKT\n"+p.titel+"\nForschungsfragen: "+(p.forschungsfragen||"–")+"\nErwartung: "+(p.erwartung||"–")+"\n"
    + (s? "\nANALYSESET\n"+s.name+"\nForschungsfrage: "+(s.frage||"–")+"\nErwartung: "+(s.erwartung||"–")+"\n" : "")
    + "\nANALYSEN\n"+anaTxt+"\n\nERGEBNISSE\n"+table+"\n"+(notes? "\nNOTIZEN ZU DEN PROBEN\n"+notes+"\n" : "")
    + "\nAUFGABE\nGliedere in: 1. Befund (was die Daten zeigen, Vergleich der Varianten mit der Kontrolle bzw. dem Grundsubstrat), 2. Bezug zur Forschungsfrage und zur Erwartung, 3. Plausibilität und Auffälligkeiten, 4. Unsicherheiten und Datenlücken, 5. Empfohlene nächste Schritte.").slice(0, 120000);
}

const PF = { mailbox:"", mailboxes:[], items:[], loading:false, error:"", q:"", loaded:false, statusLoaded:false };
async function pfApi(pathWithQuery){
  const tok = (window.RS && window.RS.token) ? await window.RS.token() : null;
  const r = await fetch(pathWithQuery, { headers: { Authorization: "Bearer " + tok } });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("Fehler " + r.status));
  return j;
}
async function pfInit(){
  if(PF.statusLoaded) return; PF.statusLoaded = true;

    const st = await pfApi("/api/mail/status");
    PF.mailboxes = st.mailboxes || [];
    if(!PF.mailbox && PF.mailboxes.length) PF.mailbox = PF.mailboxes[0];
    if(!st.configured) PF.error = "Die Microsoft-365-Anbindung ist noch nicht eingerichtet.";
  } catch(e){ PF.error = e.message; }
  if(route()==="postfach") render();
  if(PF.mailbox && !PF.loaded && !PF.error) pfLoadInbox();
}
async function pfLoadInbox(){
  if(!PF.mailbox) return;

}
async function pfSearch(){

  catch(e){ toast("E-Mail konnte nicht geladen werden: "+e.message); return; }

function pfHtmlToText(html){
  if(!html) return "";
  return html
    .replace(/<\s*br\s*\/?>/gi, "\n")
    .replace(/<\/\s*(p|div|tr|li|h[1-6]|table)\s*>/gi, "\n")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
    .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'").replace(/&apos;/gi, "'");
}
function parseSignatur(msg){
  const raw = (msg.bodyType==="html") ? pfHtmlToText(msg.body) : (msg.body||"");
  const lines = raw.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  const out = {};
  if(msg.von && !/@/.test(msg.von) && /[a-zäöü]/i.test(msg.von)) out.ansprechpartner = msg.von.trim();
  if(msg.vonAdresse) out.email = msg.vonAdresse.trim();
  const firmaRe = /(.*\b(?:gGmbH|GmbH(?:\s*&\s*Co\.?\s*KG)?|AG|KG|OHG|UG(?:\s*\(haftungsbeschränkt\))?|GbR|e\.?\s?K\.?|e\.?\s?V\.?|mbH|Ltd\.?|Inc\.?|AöR)\b.*)/;
  for(const l of lines){ const m=l.match(firmaRe); if(m){ out.name = m[1].trim().replace(/^[^A-Za-zÄÖÜ0-9]+/,""); break; } }
  if(!out.name && out.ansprechpartner) out.name = out.ansprechpartner;
  let tel = "";
  for(const l of lines){ if(/(tel|telefon|phone|fon|mobil|mobile|durchwahl|\bt:)/i.test(l)){ const m=l.match(/(\+?\(?\d[\d\s().\/\-]{6,}\d)/); if(m){ tel=m[1].trim(); break; } } }
  if(!tel){ for(const l of lines){ const m=l.match(/(\+49[\d\s().\/\-]{5,}\d)/); if(m){ tel=m[1].trim(); break; } } }
  if(tel) out.telefon = tel.replace(/\s{2,}/g," ").trim();
  for(const l of lines){ const m=l.match(/\b(\d{5})\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\-\/ ]{1,40})$/); if(m){ out.plz=m[1]; out.ort=m[2].trim(); break; } }
  for(const l of lines){ if(/\b(stra(?:ß|ss)e|str\.|weg|allee|platz|gasse|ring|damm|ufer|chaussee)\b/i.test(l) && /\d/.test(l)){ const m=l.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]*\s*\d+[a-zA-Z]?)/); if(m){ out.strasse=m[1].trim(); break; } } }
  let web=""; for(const l of lines){ const m=l.match(/\b((?:https?:\/\/)?www\.[^\s]+|[a-z0-9.\-]+\.(?:de|com|at|ch|eu|org|net)(?:\/\S*)?)/i); if(m && !/@/.test(m[1])){ web=m[1]; break; } }
  out.notiz = ("Aus E-Mail: "+(msg.betreff||"")+(web?("\nWebsite: "+web):"")).trim();
  return out;
}

// ---------- Angebote & Rechnungen ----------
const ANG_STATUS=[["Entwurf","p-mute"],["versendet","p-s3"],["angenommen","p-s1"],["abgelehnt","p-warn"]];
const RECH_STATUS=[["zu stellen","p-warn"],["gestellt","p-s3"],["bezahlt","p-s1"],["storniert","p-mute"]];
const ANG_HINWEIS="Alle Preise verstehen sich in Euro zzgl. der gesetzlichen Umsatzsteuer. Es gelten unsere Allgemeinen Geschäftsbedingungen (AGB).";
const RECH_HINWEIS="Alle Preise in Euro. Es gelten unsere Allgemeinen Geschäftsbedingungen (AGB). Vielen Dank für die gute Zusammenarbeit.";
const FIRMA_DEFAULT={name:"reSoilution GmbH",strasse:"",plz:"76684",ort:"Östringen",land:"Deutschland",tel:"+49 171 3145599",email:"info@resoilution.com",web:"www.resoilution.com",gf:"Philipp Max Schwab",ustid:"",steuernr:"",amtsgericht:"",hrb:"",bank:"",iban:"",bic:"",zahlungsziel:14,ustsatz:19};
const firmaNow=()=>Object.assign({},FIRMA_DEFAULT,S.firma||{});
const colOf=typ=>typ==="angebot"?"angebote":"rechnungen";
const beleg=(typ,id)=>byId(S[colOf(typ)],id);
const nf=n=>Number(n||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>nf(n)+" €";
const fmtMenge=n=>{n=Number(n||0);return Number.isInteger(n)?String(n):n.toLocaleString("de-DE");};
function plusDays(iso,d){ const t=new Date((iso||todayISO())+"T00:00:00"); t.setDate(t.getDate()+Number(d||0)); return t.toISOString().slice(0,10); }
function nextNr(typ){ const pre=typ==="angebot"?"A":"RE"; const y=new Date().getFullYear(); let mx=0; (S[colOf(typ)]||[]).forEach(d=>{ const m=(d.nr||"").match(new RegExp("^"+pre+"-"+y+"-(\\d+)$")); if(m) mx=Math.max(mx,+m[1]); }); return pre+"-"+y+"-"+String(mx+1).padStart(3,"0"); }
function belegEmpf(doc){ return doc.empfTyp==="lieferant" ? lief(doc.lieferantId) : kunde(doc.kundeId); }
function belegEmpfName(doc){ const e=belegEmpf(doc); return e? e.name : "–"; }
function belegTotals(doc){ const satz=Number(doc.ustsatz!=null?doc.ustsatz:(firmaNow().ustsatz||19)); const netto=(doc.positionen||[]).reduce((s,p)=>s+Number(p.menge||0)*Number(p.einzel||0),0); const ust=netto*satz/100; return {satz,netto,ust,brutto:netto+ust}; }
const tageSeit=iso=>{ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); };

function vBelege(typ){
  const isA=typ==="angebot"; const col=colOf(typ); const list0=S[col]||[];
  const STAT=isA?ANG_STATUS:RECH_STATUS;
  const flt = isA? (S.angFilter||(S.angFilter={q:"",status:""})) : (S.rechFilter||(S.rechFilter={q:"",status:""}));
  const title=isA?"Angebote":"Rechnungen";
  const lede=isA?"Angebote erstellen, einem Kunden oder Lieferanten zuordnen, als PDF ausgeben, kopieren und nachfassen.":"Rechnungen erstellen, Status verfolgen (zu stellen, gestellt, bezahlt) und als PDF ausgeben.";
  let h='<div class="head"><div><h2>'+title+'</h2><div class="lede">'+lede+'</div></div><div class="actions">'
    +(canW()?'<button class="btn" data-act="'+(isA?"newAngebot":"newRechnung")+'">'+(isA?"Angebot":"Rechnung")+' erstellen</button>':'')
    +'<button class="btn ghost" data-firma>Firmendaten</button></div></div>';
  // KPIs
  const sum=arr=>arr.reduce((s,d)=>s+belegTotals(d).brutto,0);
  if(isA){
    const offen=list0.filter(d=>d.status==="versendet");
    const nach=offen.filter(d=>tageSeit(d.versendetAm)>=10);
    const ang=list0.filter(d=>d.status==="angenommen");
    h+='<div class="kpis">'
      +kpi("Angebote gesamt",list0.length,"alle",'var(--s3)',"#angebote")
      +kpi("Versendet",offen.length,"warten auf Antwort",'var(--s2)')
      +kpi("Nachfassen",nach.length,"≥ 10 Tage offen",'var(--warn)')
      +kpi("Angenommen",ang.length,money(sum(ang)),'var(--s1)')+'</div>';
  } else {
    const zu=list0.filter(d=>d.status==="zu stellen");
    const gestellt=list0.filter(d=>d.status==="gestellt");
    const bezahlt=list0.filter(d=>d.status==="bezahlt");
    h+='<div class="kpis">'
      +kpi("Noch zu stellen",zu.length,money(sum(zu)),'var(--warn)')
      +kpi("Gestellt / offen",gestellt.length,money(sum(gestellt)),'var(--s3)')
      +kpi("Bezahlt",bezahlt.length,money(sum(bezahlt)),'var(--s1)')
      +kpi("Rechnungen gesamt",list0.length,"alle",'var(--s4)')+'</div>';
  }
  h+='<div class="toolbar"><input id="'+(isA?"angq":"rechq")+'" type="search" placeholder="Suche Nr., Empfänger …" value="'+esc(flt.q||"")+'" aria-label="Suche">'
    +'<select id="'+(isA?"angstatus":"rechstatus")+'" aria-label="Status"><option value="">Alle Status</option>'+STAT.map(s=>'<option '+(flt.status===s[0]?"selected":"")+'>'+esc(s[0])+'</option>').join("")+'</select></div>';
  if(!list0.length) return h+'<div class="panel empty"><b>Noch keine '+title+'</b>'+(S.loaded[col]?'Erstelle das erste '+(isA?"Angebot":"die erste Rechnung")+'.':'Daten werden geladen …')+'</div>';
  const q=(flt.q||"").trim().toLowerCase();
  let list=list0.filter(d=>(!flt.status||d.status===flt.status) && (!q||[d.nr,belegEmpfName(d),(proj(d.projektId)||{}).titel].join(" ").toLowerCase().includes(q)));
  list.sort((a,b)=>(b.nr||"").localeCompare(a.nr||""));
  if(!list.length) return h+'<div class="panel empty">Nichts passt zur Suche.</div>';
  h+='<div class="tw"><table class="t"><thead><tr><th>Nr.</th><th>Datum</th><th>Empfänger</th><th>Projekt</th><th class="num">Brutto</th><th>Status</th><th></th></tr></thead><tbody>';
  list.forEach(d=>{ const t=belegTotals(d); const pj=proj(d.projektId);
    const nach=isA&&d.status==="versendet"&&tageSeit(d.versendetAm)>=10;
    h+='<tr class="click" data-openbeleg="'+esc(d.id)+'" data-typ="'+typ+'" tabindex="0">'
      +'<td class="mono">'+esc(d.nr||"–")+'</td><td>'+fmtD(d.datum)+'</td>'
      +'<td><b>'+esc(belegEmpfName(d))+'</b>'+(d.empfTyp==="lieferant"?'<span class="sub">Lieferant</span>':'')+'</td>'
      +'<td>'+esc(pj?(pj.kurz||pj.titel):"–")+'</td>'
      +'<td class="num">'+money(t.brutto)+'</td>'
      +'<td>'+pill(d.status,STAT)+(nach?' <span class="pill p-warn">nachfassen</span>':'')+'</td>'
      +'<td class="num"><button class="btn ghost sm" data-belegpdf="'+esc(d.id)+'" data-typ="'+typ+'">PDF</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}
function vAngebote(){ return vBelege("angebot"); }
function vRechnungen(){ return vBelege("rechnung"); }

function belegPosTable(doc){
  let h='<div class="tw"><table class="t"><thead><tr><th>Pos.</th><th>Leistung</th><th class="num">Menge</th><th class="num">Einzelpreis</th><th class="num">Betrag</th></tr></thead><tbody>';
  (doc.positionen||[]).forEach((p,i)=>{ h+='<tr><td class="mono">'+(i+1)+'</td><td><b>'+esc(p.titel||"")+'</b>'+(p.beschr?'<span class="sub">'+esc(p.beschr)+'</span>':'')+'</td><td class="num">'+fmtMenge(p.menge)+' '+esc(p.einheit||"")+'</td><td class="num">'+money(p.einzel)+'</td><td class="num">'+money(Number(p.menge||0)*Number(p.einzel||0))+'</td></tr>'; });
  const t=belegTotals(doc);
  h+='<tr><td colspan="3"></td><td class="num" style="color:var(--muted)">Netto</td><td class="num">'+money(t.netto)+'</td></tr>';
  h+='<tr><td colspan="3"></td><td class="num" style="color:var(--muted)">'+nf(t.satz).replace(",00","")+' % USt</td><td class="num">'+money(t.ust)+'</td></tr>';
  h+='<tr><td colspan="3"></td><td class="num"><b>Gesamt</b></td><td class="num"><b>'+money(t.brutto)+'</b></td></tr>';
  return h+'</tbody></table></div>';
}
function showBeleg(typ,id){
  const isA=typ==="angebot"; const d=beleg(typ,id); if(!d){ closeModal(); return; }
  const STAT=isA?ANG_STATUS:RECH_STATUS; const e=belegEmpf(d); const pj=proj(d.projektId);
  let h='<div class="mh"><div><span class="lab-tag">'+(isA?"Angebot":"Rechnung")+' '+esc(d.nr||"")+'</span> '+pill(d.status,STAT)+'<h3>'+esc(belegEmpfName(d))+'</h3></div><button class="xbtn" data-close aria-label="Schließen">×</button></div>';
  h+='<div class="tw"><table class="t"><tbody>'
    +row("Empfänger",esc(belegEmpfName(d))+(e&&adr(e)?'<span class="sub">'+esc(adr(e))+'</span>':''))
    +row(isA?"Belegdatum":"Rechnungsdatum",fmtD(d.datum))
    +(isA?row("Gültig bis",fmtD(d.gueltigBis)):row("Leistungsdatum",fmtD(d.leistungsdatum))+row("Zahlungsziel",fmtD(d.faelligBis)))
    +(pj?row("Projekt",esc(pj.kurz||pj.titel)):"")
    +(d.versendetAm?row("Versendet am",fmtDT(d.versendetAm)):"")
    +(!isA&&d.bezahltAm?row("Bezahlt am",fmtD(d.bezahltAm)):"")
    +'</tbody></table></div>';
  h+=belegPosTable(d);
  if(d.hinweis) h+='<div class="detail"><h4>Hinweise</h4><p>'+esc(d.hinweis)+'</p></div>';
  if(canW()){
    h+='<div style="margin:14px 0 4px"><span class="lab-tag">Status setzen</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
    STAT.forEach(s=>{ h+='<button class="btn ghost sm'+(d.status===s[0]?' ':'')+'" data-setstatus="'+esc(s[0])+'" data-id="'+esc(id)+'" data-typ="'+typ+'"'+(d.status===s[0]?' style="border-color:var(--accent);color:var(--accent)"':'')+'>'+esc(s[0])+'</button>'; });
    h+='</div></div>';
  }
  h+='<div class="mf">'
    +(canW()?'<span class="left"><button class="btn danger sm" data-askdel>Löschen</button></span>':'')
    +'<button class="btn ghost" data-belegpdf="'+esc(id)+'" data-typ="'+typ+'">PDF / Drucken</button>'
    +(canW()?'<button class="btn ghost" data-copybeleg="'+esc(id)+'" data-typ="'+typ+'">'+(isA?"Kopieren":"Als Angebot/Kopie")+'</button>':'')
    +(canW()&&e&&e.email?'<button class="btn ghost" data-send="'+esc(id)+'" data-typ="'+typ+'">Versenden</button>':'')
    +(canW()?'<button class="btn ghost" data-editbeleg="'+esc(id)+'" data-typ="'+typ+'">Bearbeiten</button>':'')
    +'<button class="btn" data-close>Schließen</button></div>';
  openModal(h, ()=>showBeleg(typ,id));
  wireDelete(async()=>{ await remove(colOf(typ),id); closeModal(); toast((isA?"Angebot":"Rechnung")+" gelöscht"); });
}

function editBeleg(typ,id,prefill){
  const isA=typ==="angebot"; const col=colOf(typ);
  const d = id? clone(beleg(typ,id)) : Object.assign({
    nr:nextNr(typ), datum:todayISO(), empfTyp:"kunde", kundeId:"", lieferantId:"", projektId:"",
    status:isA?"Entwurf":"zu stellen",
    gueltigBis:isA?plusDays(todayISO(),30):undefined,
    leistungsdatum:!isA?todayISO():undefined,
    faelligBis:!isA?plusDays(todayISO(),firmaNow().zahlungsziel||14):undefined,
    bezahltAm:"", positionen:[], hinweis:isA?ANG_HINWEIS:RECH_HINWEIS
  }, prefill||{});

  const STAT=isA?ANG_STATUS:RECH_STATUS;
  const kundenOpts=cur=>'<option value="">— wählen —</option>'+S.kunden.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(k=>'<option value="'+esc(k.id)+'" '+(cur===k.id?"selected":"")+'>'+esc(k.name)+'</option>').join("");
  const liefOpts=cur=>'<option value="">— wählen —</option>'+S.lieferanten.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(l=>'<option value="'+esc(l.id)+'" '+(cur===l.id?"selected":"")+'>'+esc(l.name)+'</option>').join("");
  const projOpts=cur=>'<option value="">— ohne Projekt —</option>'+S.projekte.map(p=>'<option value="'+esc(p.id)+'" '+(cur===p.id?"selected":"")+'>'+esc(p.nr+" · "+(p.kurz||p.titel))+'</option>').join("");
  let h='<div class="mh"><h3>'+(id?"Bearbeiten":(isA?"Angebot erstellen":"Rechnung erstellen"))+' · '+esc(d.nr)+'</h3><button class="xbtn" data-close aria-label="Schließen">×</button></div>';
  h+='<form id="fBeleg" class="form">'
    +'<div class="f"><label for="i-empfTyp">Empfänger-Art</label><select id="i-empfTyp" name="empfTyp"><option value="kunde"'+(d.empfTyp!=="lieferant"?" selected":"")+'>Kunde</option><option value="lieferant"'+(d.empfTyp==="lieferant"?" selected":"")+'>Lieferant</option></select></div>'
    +'<div class="f"><label for="i-empfId">Empfänger</label><select id="i-empfId" name="empfId">'+(d.empfTyp==="lieferant"?liefOpts(d.lieferantId):kundenOpts(d.kundeId))+'</select></div>'
    +'<div class="f full"><label for="i-projektId">Projekt (optional)</label><select id="i-projektId" name="projektId">'+projOpts(d.projektId)+'</select></div>'
    +fld("nr","Nummer",d.nr)
    +sel("status","Status",STAT.map(s=>s[0]),d.status)
    +fld("datum",isA?"Belegdatum":"Rechnungsdatum",d.datum,"","","date")
    +(isA? fld("gueltigBis","Gültig bis",d.gueltigBis,"","","date")
         : fld("leistungsdatum","Leistungsdatum",d.leistungsdatum,"","","date")+fld("faelligBis","Zahlungsziel (fällig bis)",d.faelligBis,"","","date")+fld("bezahltAm","Bezahlt am (echter Eingang)",d.bezahltAm,"","","date"))
    +'</form>';
  h+='<div style="margin:6px 0 4px"><span class="lab-tag">Positionen</span></div><div id="posBody"></div>'
    +'<button type="button" class="btn ghost sm" id="addPos">+ Position</button>';
  h+='<div id="posTot" style="margin-top:14px"></div>';
  h+='<div class="f full" style="margin-top:12px"><label for="i-hinweis">Hinweise (unten im Dokument)</label><textarea id="i-hinweis" name="hinweis">'+esc(d.hinweis||"")+'</textarea></div>';
  h+='<div class="mf">'+(id?'<span class="left" id="delWrap"><button class="btn danger sm" data-askdel>Löschen</button></span>':'')
    +'<button class="btn ghost" id="saveBelegPdf">Speichern & PDF</button>'
    +'<button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="saveBeleg">Speichern</button></div>';
  openModal(h);

  function rowHtml(p,i){ return '<div class="posrow" data-i="'+i+'" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">'
    +'<div style="display:grid;grid-template-columns:1fr 70px 80px 100px 1fr 32px;gap:8px;align-items:center">'
    +'<input data-k="titel" placeholder="Leistung" value="'+esc(p.titel||"")+'">'
    +'<input data-k="menge" type="number" step="0.01" min="0" value="'+esc(p.menge==null?"":p.menge)+'" aria-label="Menge">'
    +'<input data-k="einheit" placeholder="Einheit" value="'+esc(p.einheit||"")+'">'
    +'<input data-k="einzel" type="number" step="0.01" min="0" placeholder="Einzelpreis" value="'+esc(p.einzel==null?"":p.einzel)+'" aria-label="Einzelpreis">'
    +'<div class="num" data-betrag style="text-align:right;font-variant-numeric:tabular-nums">'+money(Number(p.menge||0)*Number(p.einzel||0))+'</div>'
    +'<button type="button" class="btn ghost sm" data-rm aria-label="Position entfernen">×</button></div>'
    +'<input data-k="beschr" placeholder="Beschreibung (optional)" value="'+esc(p.beschr||"")+'" style="margin-top:6px;width:100%">'
    +'</div>'; }
  function renderPos(){ $("#posBody").innerHTML=pos.map(rowHtml).join(""); recalc(); }
  function recalc(){ let netto=0; pos.forEach((p,i)=>{ const b=Number(p.menge||0)*Number(p.einzel||0); netto+=b; const el=document.querySelector('.posrow[data-i="'+i+'"] [data-betrag]'); if(el) el.textContent=money(b); }); const satz=firmaNow().ustsatz||19; const ust=netto*satz/100;
    $("#posTot").innerHTML='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums">'
      +'<div style="display:flex;gap:24px"><span style="color:var(--muted)">Netto</span><span style="min-width:120px;text-align:right">'+money(netto)+'</span></div>'
      +'<div style="display:flex;gap:24px"><span style="color:var(--muted)">'+satz+' % USt</span><span style="min-width:120px;text-align:right">'+money(ust)+'</span></div>'
      +'<div style="display:flex;gap:24px;font-weight:700;color:var(--accent)"><span>Gesamt (brutto)</span><span style="min-width:120px;text-align:right">'+money(netto+ust)+'</span></div></div>';
  }
  renderPos();
  const formEl=$("#fBeleg");
  $("#i-empfTyp").onchange=e=>{ const v=e.target.value; $("#i-empfId").innerHTML = v==="lieferant"? liefOpts("") : kundenOpts(""); };
  $("#posBody").addEventListener("input",e=>{ const rowEl=e.target.closest(".posrow"); if(!rowEl) return; const i=+rowEl.dataset.i; const k=e.target.dataset.k; if(k){ pos[i][k]=e.target.value; recalc(); } });
  $("#posBody").addEventListener("click",e=>{ const rm=e.target.closest("[data-rm]"); if(!rm) return; const i=+rm.closest(".posrow").dataset.i; pos.splice(i,1); if(!pos.length) pos.push({titel:"",beschr:"",menge:1,einheit:"Stück",einzel:""}); renderPos(); });
  $("#addPos").onclick=()=>{ pos.push({titel:"",beschr:"",menge:1,einheit:"Stück",einzel:""}); renderPos(); };

  async function doSave(thenPdf){
    const f=formData("#fBeleg");
    const empfId=$("#i-empfId").value;
    if(!empfId){ toast("Bitte einen Empfänger wählen."); return null; }
    const clean=pos.map(p=>({titel:(p.titel||"").trim(),beschr:(p.beschr||"").trim(),menge:Number(p.menge||0),einheit:(p.einheit||"").trim(),einzel:Number(p.einzel||0)})).filter(p=>p.titel||p.einzel);
    if(!clean.length){ toast("Bitte mindestens eine Position mit Leistung angeben."); return null; }
    const out=Object.assign({},d,{
      nr:f.nr, status:f.status, datum:f.datum, projektId:f.projektId||"",
      empfTyp:f.empfTyp, kundeId:f.empfTyp==="lieferant"?"":empfId, lieferantId:f.empfTyp==="lieferant"?empfId:"",
      positionen:clean, hinweis:f.hinweis||"", updatedAt:new Date().toISOString()
    });
    if(isA){ out.gueltigBis=f.gueltigBis||""; } else { out.leistungsdatum=f.leistungsdatum||""; out.faelligBis=f.faelligBis||""; out.bezahltAm=f.bezahltAm||""; }
    if(f.status==="versendet" && !out.versendetAm) out.versendetAm=new Date().toISOString();
    const docId=id||S.db.collection(col).doc().id; delete out.id;
    await write(col,docId,out); toast((isA?"Angebot":"Rechnung")+" gespeichert");
    if(thenPdf) printBeleg(typ,docId); else showBeleg(typ,docId);
    return docId;
  }
  $("#saveBeleg").onclick=()=>doSave(false);
  $("#saveBelegPdf").onclick=()=>doSave(true);
  wireDelete(async()=>{ await remove(col,id); closeModal(); toast("Gelöscht"); });
}

function copyBeleg(typ,id){
  const src=beleg(typ,id); if(!src) return;
  const p=clone(src);
  delete p.id; p.nr=nextNr(typ); p.datum=todayISO(); p.status=typ==="angebot"?"Entwurf":"zu stellen";
  p.versendetAm=""; p.bezahltAm="";
  if(typ==="angebot") p.gueltigBis=plusDays(todayISO(),30); else { p.leistungsdatum=todayISO(); p.faelligBis=plusDays(todayISO(),firmaNow().zahlungsziel||14); }
  editBeleg(typ,null,p);
}
async function setBelegStatus(typ,id,status){
  const src=beleg(typ,id); if(!src) return; const d=clone(src); delete d.id;
  d.status=status;

function vStunden(){
  const f=S.sFilter; let rows=S.stunden.slice();
  const q=(f.q||"").toLowerCase();
  if(q) rows=rows.filter(h=>{ const p=proj(h.projektId); return [p?p.nr:"", p?p.titel:"", p?p.kurz:"", h.taetigkeit, h.wer].join(" ").toLowerCase().includes(q); });
  if(f.wer) rows=rows.filter(h=>h.wer===f.wer);
  if(f.von) rows=rows.filter(h=>h.datum&&h.datum>=f.von);
  if(f.bis) rows=rows.filter(h=>h.datum&&h.datum<=f.bis);
  rows.sort((a,b)=> (b.datum||"").localeCompare(a.datum||"") || (b.when||"").localeCompare(a.when||""));
  const totM=rows.reduce((s,h)=>s+(h.minuten||0),0);
  const allM=S.stunden.reduce((s,h)=>s+(h.minuten||0),0);
  let h='<div class="head"><div><h2>Stunden</h2><div class="lede">'+S.stunden.length+' Einträge · '+stHM(allM)+' gesamt erfasst</div></div>'
    +(canW()?'<div class="actions"><button class="btn" data-act="newStunde">Stunden erfassen</button></div>':'')+'</div>';
  h+='<div class="toolbar"><input id="sq" placeholder="Suche Projekt, Tätigkeit, Person …" value="'+esc(f.q)+'">'
    +'<select id="swer" aria-label="Nach Person filtern"><option value="">Alle Personen</option>'+S.team.map(n=>'<option '+(f.wer===n?"selected":"")+'>'+esc(n)+'</option>').join("")+'</select>'
    +'<input id="svon" type="date" value="'+esc(f.von)+'" aria-label="Von">'
    +'<input id="sbis" type="date" value="'+esc(f.bis)+'" aria-label="Bis">'
    +'</div>';
  if(!rows.length){ h+='<div class="tw"><div class="empty"><b>'+(S.stunden.length?"Keine Treffer":"Noch keine Stunden")+'</b>'+(S.stunden.length?"Für die aktuellen Filter gibt es keine Einträge.":"Erfasse den ersten Eintrag über den Button oben rechts.")+'</div></div>'; return h; }
  h+='<div class="tw"><table class="t"><thead><tr><th>Datum</th><th>Person</th><th>Projekt</th><th>Tätigkeit</th><th class="num">Dauer</th><th></th></tr></thead><tbody>';
  rows.forEach(e=>{ const p=proj(e.projektId);
    h+='<tr><td class="mono">'+fmtD(e.datum)+'</td><td>'+esc(e.wer||"–")+'</td>'
      +'<td>'+(p?'<b>'+esc(p.nr)+'</b> <span class="sub" style="display:inline">'+esc(p.kurz||p.titel)+'</span>':'<span class="sub" style="display:inline">ohne Projekt</span>')+'</td>'
      +'<td>'+esc(e.taetigkeit||"–")+(e.von&&e.bis?'<span class="sub">'+esc(e.von)+'–'+esc(e.bis)+'</span>':'')+'</td>'
      +'<td class="num">'+stHM(e.minuten)+'</td>'
      +'<td class="num">'+(canW()?'<button class="btn ghost sm" data-editstunde="'+esc(e.id)+'">bearbeiten</button>':'')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4" style="text-align:right;font-weight:600">Summe ('+rows.length+')</td><td class="num" style="font-weight:600">'+stHM(totM)+'</td><td></td></tr></tfoot></table></div>';
  return h;
}

   +'</form><div class="mf">'+(id?'<span class="left" id="delWrap"><button class="btn danger sm" data-askdel>Löschen</button></span>':'')+'<button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="saveStd">'+(id?"Speichern":"Erfassen")+'</button></div>';
  openModal(h);
  const von=$("#i-von"),bis=$("#i-bis"),hh=$("#i-h"),mm=$("#i-m"),badge=$("#durBadge");

  document.querySelectorAll("#modalRoot [data-tat]").forEach(el=>el.onclick=()=>{ $("#i-taetigkeit").value=el.dataset.tat; });

    if(!f.projektId && !(f.taetigkeit||"").trim()){ toast("Bitte ein Projekt wählen oder eine Tätigkeit eintragen."); return; }
    const data={ datum:f.datum||todayISO(), wer:f.wer||"", projektId:f.projektId||"", taetigkeit:(f.taetigkeit||"").trim(), von:von.value||"", bis:bis.value||"", minuten:min, when:e.when||new Date().toISOString(), who:e.who||S.meId||"" };
    const docId = id || S.db.collection("stunden").doc().id;
    await write("stunden", docId, data); closeModal(); toast(id?"Gespeichert":stHM(min)+" erfasst");
  };
  wireDelete(async()=>{ await remove("stunden",id); closeModal(); toast("Eintrag gelöscht"); });
}

  if(t.dataset.ana) return showAnalyse(t.dataset.ana);
  if(t.dataset.editset!==undefined) return editSet(t.dataset.pid, t.dataset.editset);
  if(t.dataset.editprojekt) return editProjekt(t.dataset.editprojekt);
  if(t.dataset.editana) return editAnalyse(t.dataset.editana);
  if(t.dataset.editlab) return editLabor(t.dataset.editlab);
  if(t.dataset.addnote){ const txt=$("#noteTxt").value.trim(); if(!txt) return; const col=t.dataset.addnote, id=t.dataset.doc; const src=byId(S[col],id); const d=clone(src); delete d.id; d.notizen=d.notizen||[]; d.notizen.push({when:new Date().toISOString(), who:S.meId||"", text:txt}); $("#noteTxt").value=""; await write(col,id,d); toast("Notiz gespeichert"); return; }
  if(t.id==="kiRegelnSave"){ await write("einstellungen","ki",{regeln:$("#kiRegeln").value}); toast("Regeln gespeichert"); return; }
  if(t.id==="kiStop"){ S.kiCtl&&S.kiCtl.abort(); return; }
  if(t.id==="kiSave"){ const id=S.db.collection("auswertungen").doc().id; await write("auswertungen",id,{projektId:S.kiSel.projekt, setId:S.kiSel.set, when:new Date().toISOString(), who:S.meId||"", text:S.kiText}); S.kiText=""; render(); toast("Auswertung gespeichert"); return; }
  if(t.id==="kiRun"){
    const p=proj(S.kiSel.projekt), s=setOf(p,S.kiSel.set), m=resultMatrix(p.id, s?s.id:"");
    S.kiBusy=true; S.kiText=""; S.kiCtl=new AbortController(); render();
    try { const r = await S.sample(buildPrompt(p,s,m), {signal:S.kiCtl.signal, modelTier:"complex", cache:false, onText:({text})=>{ S.kiText=text; const o=$("#kiOut"); if(o) o.textContent=text; }}); S.kiText=r.text+(r.truncated?"\n\n[Die Antwort wurde gekürzt. Bitte ein einzelnes Set auswerten.]":""); }
    catch(err){ S.kiText = err&&err.text? err.text : ""; const m2={not_granted:"Die KI-Auswertung wurde nicht freigegeben.",rate_limited:"Gerade zu viele Anfragen. Bitte später erneut versuchen.",prompt_too_large:"Zu viele Daten auf einmal. Bitte ein einzelnes Set wählen.",refused:"Claude hat die Anfrage abgelehnt."}; if(!(err&&err.code==="cancelled")) toast(m2[err&&err.code]||"Die Auswertung ist fehlgeschlagen."); if(err&&err.code==="not_granted") S.sample=null; }
    S.kiBusy=false; render(); return;
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); if(e.key==="Enter" && e.target.matches && e.target.matches("tr.click,.chip[data-ana],a[data-lief]")) e.target.click(); if(e.key==="Enter" && e.target.id==="pfQ"){ e.preventDefault(); pfSearch(); } });
document.addEventListener("input", e=>{ if(e.target.id==="fq"){ S.filter.q=e.target.value; render(); } if(e.target.id==="lq"){ S.filter.lq=e.target.value; render(); } if(e.target.id==="kq"){ S.kFilter.q=e.target.value; render(); } if(e.target.id==="pq"){ S.pFilter.q=e.target.value; render(); } if(e.target.id==="angq"){ S.angFilter.q=e.target.value; render(); } if(e.target.id==="rechq"){ S.rechFilter.q=e.target.value; render(); } if(e.target.id==="sq"){ S.sFilter.q=e.target.value; render(); } if(e.target.id==="pfQ"){ PF.q=e.target.value; } });
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="fprojekt"){ S.filter.projekt=e.target.value; render(); }
  if(id==="fstatus"){ S.filter.status=e.target.value; render(); }
  if(id==="flabor"){ S.filter.labor=e.target.value; render(); }
  if(id==="lland"){ S.filter.lland=e.target.value; render(); }
  if(id==="kland"){ S.kFilter.land=e.target.value; render(); }
  if(id==="angstatus"){ S.angFilter.status=e.target.value; render(); }
  if(id==="rechstatus"){ S.rechFilter.status=e.target.value; render(); }
  if(id==="swer"){ S.sFilter.wer=e.target.value; render(); }
  if(id==="svon"){ S.sFilter.von=e.target.value; render(); }
  if(id==="sbis"){ S.sFilter.bis=e.target.value; render(); }
  if(id==="aProjekt"){ S.aFilter.projekt=e.target.value; render(); }
  if(id==="aKat"){ S.aFilter.kategorie=e.target.value; render(); }
  if(id==="kiP"){ S.kiSel.projekt=e.target.value; S.kiSel.set=""; S.kiText=""; render(); }
  if(id==="kiS"){ S.kiSel.set=e.target.value; S.kiText=""; render(); }
  if(id==="pfMbox"){ PF.mailbox=e.target.value; PF.loaded=false; PF.items=[]; pfLoadInbox(); }
});

boot();
})();
</script>
